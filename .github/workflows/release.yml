name: Release

# v1.2.3 のようなタグを push すると、署名済みAPKとSHA-256をGitHub Releaseに添付する。
# GitHubの画面で「Create a new release」から新しいタグを作った場合も動く(既存のReleaseに添付する)。
# アプリの「更新を確認」はこのリリースを参照する(F10)。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 が未設定です(README の「リリース」を参照)"; exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testReleaseUnitTest :app:assembleRelease -PversionName="${GITHUB_REF_NAME#v}"

      - name: Publish release with SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="OpenCloudFlac-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" | cut -d' ' -f1 > "$APK.sha256"
          SHA=$(cat "$APK.sha256")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # GitHubの画面から「Release作成」でタグを打った場合: 既存のReleaseに添付し、本文にSHA-256を追記する
            gh release upload "$GITHUB_REF_NAME" "$APK" "$APK.sha256" --clobber
            BODY=$(gh release view "$GITHUB_REF_NAME" --json body -q .body)
            if ! printf '%s' "$BODY" | grep -q "$SHA"; then
              printf '%s\n\nSHA-256: %s\n' "$BODY" "$SHA" > notes.md
              gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
              --title "$GITHUB_REF_NAME" \
              --notes "SHA-256: $SHA"
          fi
          rm -f "$RUNNER_TEMP/release.jks"
